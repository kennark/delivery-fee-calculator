spring:
  application:
    name: DeliveryDemoApi

  datasource:
    url: jdbc:h2:file:./db/demo
    driverClassName: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
    show-sql: true


  flyway:
    enabled: true
    locations: classpath:db/migration